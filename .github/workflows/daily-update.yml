name: Daily update

on:
  schedule:
    # Several runs a day: right after each market closes, plus a catch-up run
    # because Yahoo sometimes publishes a closing price a few hours late.
    - cron: "30 9 * * 1-5"   # after the Singapore close
    - cron: "0 16 * * 1-5"   # after the European closes
    - cron: "30 22 * * 1-5"  # after the Wall Street close
    - cron: "0 4 * * 2-6"    # catch-up for late US prices
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Save new prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898782+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update prices"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
